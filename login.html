<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Camping Sonrisas Compartidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f4;--fg:#17191d;--card:#fff;--muted:#6b717c;--border:#dcdfe6;--input:#d9dce3;--ring:#5b7fe5;--accent-fg:#4168d5;--danger:#c83737;--stage:#101316;--ok:#44d68b;--warn:#f5a524;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.side{position:relative;overflow:hidden;background:var(--stage);color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:48px}
.side::before{content:"";position:absolute;width:760px;height:760px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(91,127,229,.26),transparent 66%);pointer-events:none}
.side>*{position:relative}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px}
.brand-logo{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.welcome{max-width:420px}
.welcome h1{margin:0 0 16px;font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.welcome p{margin:0;font-size:17px;line-height:1.6;color:#c3c8d2}
.copy{margin:0;font-size:13px;color:#a3a9b4}
.main{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(23,25,29,.06);padding:36px 32px;display:flex;flex-direction:column;gap:20px}
.card h2{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.hint{margin:0;font-size:14px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
label{font-size:14px;font-weight:500}
.input{height:44px;padding:0 12px;border:1px solid var(--input);border-radius:8px;font:inherit;font-size:15px;color:var(--fg);background:#fff}
.input:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px rgba(91,127,229,.35)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--fg);margin:0}
.btn{height:44px;border:0;border-radius:8px;background:var(--fg);color:#fff;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.btn:hover{background:#2e3138}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(91,127,229,.5)}
.btn:disabled{opacity:.6;cursor:default}
a{color:var(--fg);font-weight:500}
a:hover{color:var(--accent-fg)}
.small{font-size:13px}
.error{margin:0;padding:10px 12px;border-radius:8px;background:rgba(200,55,55,.08);color:var(--danger);font-size:14px}
.foot{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.foot a{font-weight:600}

/* Bit */
.bit{display:block;width:200px;height:200px;margin:0 0 12px -28px;--antena:var(--ok)}
.bit [data-show]{display:none}
.bit[data-state="saludando"] [data-show~="saludando"],
.bit[data-state="esperando"] [data-show~="esperando"],
.bit[data-state="contrasena"] [data-show~="contrasena"],
.bit[data-state="pensando"] [data-show~="pensando"],
.bit[data-state="contento"] [data-show~="contento"],
.bit[data-state="error"] [data-show~="error"]{display:inline}
.bit[data-state="contrasena"]{--antena:var(--ring)}
.bit[data-state="pensando"]{--antena:var(--warn)}
.bit[data-state="error"]{--antena:var(--bad)}
.bit-antena{fill:var(--antena);animation:bt-pulse 1.6s ease-in-out infinite}
.bit[data-state="contrasena"] .bit-antena{animation:none}
.bit[data-state="pensando"] .bit-antena,.bit[data-state="error"] .bit-antena{animation-duration:.6s}
.bit-cuerpo{animation:bt-float 3s ease-in-out infinite}
.bit[data-state="contento"] .bit-cuerpo{animation:bt-jump 1s ease-in-out infinite}
.bit[data-state="error"] .bit-cuerpo{animation:bt-shake 1.8s ease-in-out infinite}
.bit-sombra{transform-box:fill-box;transform-origin:50% 50%;animation:bt-shadow 3s ease-in-out infinite}
.bit-parpadeo{transform-box:fill-box;transform-origin:50% 50%;animation:bt-blink 4.2s infinite}
.bit-saludo{transform-box:fill-box;transform-origin:0% 100%;animation:bt-wave 1.1s ease-in-out infinite}
.bit-punto{animation:bt-dot 1.2s ease-in-out infinite}
.bit-punto:nth-of-type(2){animation-delay:.15s}
.bit-punto:nth-of-type(3){animation-delay:.3s}
@keyframes bt-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bt-shadow{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
@keyframes bt-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes bt-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bt-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes bt-dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}
@keyframes bt-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(-14px)}}
@keyframes bt-shake{0%,40%,100%{transform:translateX(0)}5%,15%,25%{transform:translateX(-6px)}10%,20%,30%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.bit *{animation:none !important}}

@media (max-width:820px){
  .login{grid-template-columns:1fr}
  .side{padding:32px 24px;gap:20px}
  .welcome h1{font-size:28px;margin-bottom:8px}
  .welcome p{font-size:15px}
  .bit{width:116px;height:116px;margin:0 0 4px -16px}
  .copy{display:none}
  .card{border:0;box-shadow:none;padding:8px 0}
  .main{padding:28px 24px;background:#fff}
  .input,.btn{height:48px;font-size:16px}
}
</style>
</head>
<body>
<div class="login">
  <section class="side">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 36 36" width="36" height="36" aria-hidden="true"><circle cx="18" cy="18" r="18" fill="#5b7fe5"/><circle cx="12.5" cy="14" r="2" fill="#fff"/><circle cx="23.5" cy="14" r="2" fill="#fff"/><path d="M10.5 21 Q18 28.5 25.5 21" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      <span>Camping Sonrisas Compartidas</span>
    </div>
    <div class="welcome">
      <svg id="bit" class="bit" data-state="saludando" viewBox="0 0 200 200" aria-hidden="true">
        <ellipse class="bit-sombra" cx="100" cy="184" rx="44" ry="7" fill="#000" opacity=".45"/>
        <g class="bit-cuerpo">
          <line x1="100" y1="42" x2="100" y2="60" stroke="#dcdfe6" stroke-width="4" stroke-linecap="round"/>
          <circle class="bit-antena" cx="100" cy="36" r="7"/>
          <!-- brazos -->
          <rect data-show="saludando esperando contrasena pensando error" x="28" y="96" width="14" height="32" rx="7" fill="#5b7fe5"/>
          <rect data-show="esperando contrasena pensando error" x="158" y="96" width="14" height="32" rx="7" fill="#5b7fe5"/>
          <g data-show="saludando"><g class="bit-saludo">
            <path d="M162 116 L182 84" stroke="#5b7fe5" stroke-width="10" stroke-linecap="round"/>
            <circle cx="184" cy="80" r="9" fill="#5b7fe5"/>
          </g></g>
          <path data-show="contento" d="M30 104 L18 84 M170 104 L182 84" stroke="#5b7fe5" stroke-width="10" stroke-linecap="round"/>
          <!-- cabeza y pantalla -->
          <rect x="38" y="60" width="124" height="104" rx="32" fill="#edf1ff"/>
          <rect x="54" y="78" width="92" height="60" rx="18" fill="#17191d"/>
          <!-- caras -->
          <g data-show="esperando"><g class="bit-parpadeo">
            <rect x="74" y="96" width="13" height="19" rx="6.5" fill="#7fe0ff"/>
            <rect x="113" y="96" width="13" height="19" rx="6.5" fill="#7fe0ff"/>
          </g></g>
          <path data-show="esperando saludando" d="M92 124 Q100 129 108 124" fill="none" stroke="#7fe0ff" stroke-width="3" stroke-linecap="round"/>
          <path data-show="saludando contento" d="M73 106 Q80.5 95 88 106 M112 106 Q119.5 95 127 106" fill="none" stroke="#7fe0ff" stroke-width="4" stroke-linecap="round"/>
          <g data-show="contrasena">
            <path d="M73 106 Q80.5 112 88 106 M112 106 Q119.5 112 127 106" fill="none" stroke="#7fe0ff" stroke-width="4" stroke-linecap="round"/>
            <circle cx="100" cy="124" r="3.5" fill="none" stroke="#7fe0ff" stroke-width="2.5"/>
          </g>
          <g data-show="pensando">
            <circle class="bit-punto" cx="82" cy="110" r="6" fill="#7fe0ff"/>
            <circle class="bit-punto" cx="100" cy="110" r="6" fill="#7fe0ff"/>
            <circle class="bit-punto" cx="118" cy="110" r="6" fill="#7fe0ff"/>
          </g>
          <path data-show="contento" d="M86 117 L114 117 Q112 131 100 131 Q88 131 86 117 Z" fill="#7fe0ff"/>
          <g data-show="error" fill="none" stroke="#ff8a8f" stroke-linecap="round">
            <path d="M74 98 L87 111 M87 98 L74 111 M113 98 L126 111 M126 98 L113 111" stroke-width="4"/>
            <path d="M88 126 Q94 120 100 126 Q106 132 112 126" stroke-width="3"/>
          </g>
        </g>
      </svg>
      <h1>Bienvenido de nuevo</h1>
      <p>Iniciá sesión para gestionar el camping.</p>
    </div>
    <p class="copy">© 2025 DEV-Ramirez Jonatan</p>
  </section>

  <main class="main">
    <form id="login-form" class="card" novalidate>
      <div>
        <h2>Iniciar sesión</h2>
        <p class="hint">Ingresá tu usuario y contraseña.</p>
      </div>
      <p id="login-error" class="error" role="alert" hidden></p>
      <div class="field">
        <label for="usuario">Usuario</label>
        <input class="input" id="usuario" name="usuario" type="text" autocomplete="username" placeholder="ej. admin" required>
      </div>
      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input class="input" id="contrasena" name="contraseña" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn" type="submit">Iniciar sesión</button>
    </form>
  </main>
</div>

<script>
  const LOGIN_URL = 'php/login.php'; // dirección del servidor que verifica el login
  let DESPUES_DE_ENTRAR = 'index.php'; // el servidor indica el destino según el rol

  const bit = document.getElementById('bit');
  const form = document.getElementById('login-form');
  const email = document.getElementById('usuario');
  const password = document.getElementById('contrasena');
  const errorBox = document.getElementById('login-error');
  const button = form.querySelector('button[type="submit"]');

  function setBit(estado) { bit.dataset.state = estado; }
  function mostrarError(texto) { errorBox.textContent = texto; errorBox.hidden = false; }

  // Bit saluda al abrir la página y después queda esperando.
  setTimeout(() => { if (bit.dataset.state === 'saludando') setBit('esperando'); }, 2500);

  email.addEventListener('focus', () => setBit('esperando'));
  password.addEventListener('focus', () => setBit('contrasena'));
  password.addEventListener('blur', () => { if (bit.dataset.state === 'contrasena') setBit('esperando'); });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.hidden = true;

    if (!email.value || !password.value) {
      mostrarError('Completá tu usuario y tu contraseña.');
      return;
    }

    button.disabled = true;
    button.textContent = 'Verificando…';
    setBit('pensando');

    let datos = null;
    try {
      const respuesta = await fetch(LOGIN_URL, {
        method: 'POST',
        credentials: 'same-origin',
        body: new FormData(form)
      });
      datos = await respuesta.json();
    } catch {
      datos = null; // sin conexión o servidor caído
    }

    if (datos && datos.success) {
      DESPUES_DE_ENTRAR = datos.redirect || DESPUES_DE_ENTRAR;
      setBit('contento');
      setTimeout(() => { window.location.href = DESPUES_DE_ENTRAR; }, 1200);
      return;
    }

    setBit('error');
    if (datos) {
      mostrarError('Usuario o contraseña incorrectos.');
    } else {
      mostrarError('No pudimos conectar. Probá de nuevo en un momento.');
    }
    button.disabled = false;
    button.textContent = 'Iniciar sesión';
    password.value = '';
    setTimeout(() => setBit('esperando'), 2500);
  });
</script>
</body>
</html>
